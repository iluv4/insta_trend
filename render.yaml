# Render Blueprint — deploy the FastAPI dashboard with one click.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" → "Blueprint" and point it at the repo. Render builds the Dockerfile,
# provisions a free Postgres instance, and wires DATABASE_URL automatically.
services:
  - type: web
    name: insta-trend-monitor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT; the Dockerfile already binds to it.
      - key: DATABASE_URL
        fromDatabase:
          name: insta-trend-db
          property: connectionString
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: COLLECT_INTERVAL_MINUTES
        value: "360"
      # Add your RapidAPI key in the Render dashboard for live collection.
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: instagram120.p.rapidapi.com

databases:
  - name: insta-trend-db
    plan: free
