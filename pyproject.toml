[project]
name = "insta-trend"
version = "0.1.0"
description = "Analyze and rank trending hashtags from Instagram-style posts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insta_trend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
